<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XHRIS Sessions — QR Code</title>
<link rel="icon" type="image/png" href="https://xhrishost.site/icon-192.png">
<style>
:root {
  --bg: #0c0c12;
  --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.07);
  --purple: #8b5cf6;
  --pink: #ec4899;
  --text: #f1f0f5;
  --muted: rgba(241,240,245,0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 15px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  overflow-x: hidden; line-height: 1.5;
}

.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(139,92,246,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,.025) 1px, transparent 1px);
  background-size: 44px 44px;
}
.bg-glow {
  position: fixed; z-index: 0; pointer-events: none;
  width: 400px; height: 400px; border-radius: 50%; filter: blur(80px);
  background: radial-gradient(circle, rgba(139,92,246,.12) 0%, transparent 70%);
  top: -120px; right: -120px;
}

/* ── Nav ── */
nav {
  position: relative; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1.25rem;
  background: rgba(12,12,18,.85);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.logo {
  display: flex; align-items: center; gap: .5rem;
  font-size: .9375rem; font-weight: 700;
  background: linear-gradient(135deg, #a78bfa, var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-decoration: none;
}
.logo-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 14px rgba(139,92,246,.35); flex-shrink: 0;
}
.logo-mark svg { width: 16px; height: 16px; fill: #fff; }

.nav-right { display: flex; align-items: center; gap: .5rem; }
.lang-btn {
  display: flex; align-items: center; gap: .3rem;
  font-size: .8125rem; font-weight: 600; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: .3rem .65rem;
  cursor: pointer; transition: all .15s; letter-spacing: .03em;
}
.lang-btn:hover { color: var(--text); border-color: rgba(255,255,255,.15); }
.lang-btn svg { width: 13px; height: 13px; opacity: .6; }

/* ── Main ── */
main {
  flex: 1; position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem 1.25rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 1.75rem 1.5rem;
  width: 100%; max-width: 380px;
  text-align: center;
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
}

.card-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(139,92,246,.28);
  margin: 0 auto .875rem;
}
.card-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

h1 {
  font-size: 1.05rem; font-weight: 700;
  letter-spacing: -.015em; margin-bottom: .35rem;
}
.subtitle {
  font-size: .8125rem; color: var(--muted); margin-bottom: 1.25rem;
  line-height: 1.5;
}

/* ── QR area ── */
.qr-wrap {
  background: #fff;
  border-radius: 12px;
  padding: .875rem;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 220px; min-height: 220px;
  margin-bottom: 1rem;
}
.qr-wrap img { display: block; width: 200px; height: 200px; }

/* ── Spinner ── */
.spinner-ring {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid rgba(139,92,246,.25);
  border-top-color: var(--purple);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Status ── */
.status-text {
  font-size: .8125rem; color: var(--muted);
  margin-bottom: 1.25rem; min-height: 1.2em;
}

/* ── Reload btn ── */
.btn-reload {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .55rem .875rem;
  background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.25);
  color: #c4b5fd; border-radius: 8px;
  font-size: .8125rem; font-weight: 600;
  cursor: pointer; transition: all .15s;
  text-decoration: none;
  display: none;
}
.btn-reload.visible { display: inline-flex; }
.btn-reload:hover { background: rgba(139,92,246,.18); }
.btn-reload svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Hint steps ── */
.steps-bar {
  margin-top: 1rem;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px;
  padding: .75rem .875rem;
  text-align: left;
}
.steps-bar-title {
  font-size: .72rem; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--muted); margin-bottom: .45rem;
}
.steps-bar ol {
  padding-left: 1.1rem; font-size: .775rem; color: var(--muted); line-height: 1.65;
}

/* ── Footer ── */
footer {
  position: relative; z-index: 5;
  text-align: center; padding: .875rem 1.25rem;
  font-size: .72rem; color: var(--muted);
  border-top: 1px solid var(--border);
}
footer a { color: #a78bfa; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<!-- NAV -->
<nav>
  <a href="/" class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    XHRIS Sessions
  </a>
  <div class="nav-right">
    <button class="lang-btn" id="langToggle" aria-label="Toggle language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span id="langLabel">EN</span>
    </button>
  </div>
</nav>

<!-- MAIN -->
<main>
  <div class="card">
    <div class="card-icon">
      <!-- Scan / QR icon -->
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><path d="M21 16h-3v3M21 21v.01M14 3v3M14 8v.01M14 13h3v3M17 21h4M11 3v18M8 13H3"/></svg>
    </div>

    <h1 data-i18n="title">Connexion par QR Code</h1>
    <p class="subtitle" data-i18n="subtitle">Scannez depuis WhatsApp → Paramètres → Appareils liés</p>

    <div class="qr-wrap" id="qrWrap">
      <div class="spinner-ring"></div>
    </div>

    <p class="status-text" id="statusText" data-i18n="loading">Génération du QR code…</p>

    <button class="btn-reload" id="reloadBtn">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      <span data-i18n="retry">Réessayer</span>
    </button>

    <div class="steps-bar" id="stepsBar" style="display:none">
      <div class="steps-bar-title" data-i18n="steps.title">Comment scanner</div>
      <ol id="stepsList"></ol>
    </div>
  </div>
</main>

<footer>
  © 2026 <a href="https://xhrishost.site" target="_blank">XHRIS Tech</a>
  &nbsp;·&nbsp; <a href="/" data-i18n="back">Retour</a>
</footer>

<script>
const i18n = {
  fr: {
    title: "Connexion par QR Code",
    subtitle: "Scannez depuis WhatsApp → Paramètres → Appareils liés",
    loading: "Génération du QR code…",
    ready: "Scannez ce QR. Votre session arrivera sur WhatsApp.",
    error: "Impossible de générer le QR code. Veuillez réessayer.",
    retry: "Réessayer",
    "steps.title": "Comment scanner",
    steps: ["Ouvrez WhatsApp sur votre téléphone","Allez dans Paramètres → Appareils liés","Tapez sur « Lier un appareil »","Scannez le QR code affiché","Votre SESSION_ID arrivera en quelques secondes"],
    back: "Retour"
  },
  en: {
    title: "QR Code Login",
    subtitle: "Scan from WhatsApp → Settings → Linked Devices",
    loading: "Generating QR code…",
    ready: "Scan this QR. Your session will arrive on WhatsApp.",
    error: "Failed to generate QR code. Please try again.",
    retry: "Retry",
    "steps.title": "How to scan",
    steps: ["Open WhatsApp on your phone","Go to Settings → Linked Devices","Tap « Link a device »","Scan the QR code displayed","Your SESSION_ID will arrive in seconds"],
    back: "Back"
  }
};

let lang = localStorage.getItem('lang') || 'fr';

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById('langLabel').textContent = lang === 'fr' ? 'EN' : 'FR';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (i18n[lang][k] !== undefined && typeof i18n[lang][k] === 'string') el.textContent = i18n[lang][k];
  });
  const ol = document.getElementById('stepsList');
  ol.innerHTML = '';
  i18n[lang].steps.forEach(s => {
    const li = document.createElement('li'); li.textContent = s; ol.appendChild(li);
  });
}

document.getElementById('langToggle').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  localStorage.setItem('lang', lang);
  applyLang();
});

async function loadQR() {
  const qrWrap = document.getElementById('qrWrap');
  const statusText = document.getElementById('statusText');
  const reloadBtn = document.getElementById('reloadBtn');
  const stepsBar = document.getElementById('stepsBar');

  qrWrap.innerHTML = '<div class="spinner-ring"></div>';
  statusText.textContent = i18n[lang].loading;
  reloadBtn.classList.remove('visible');
  stepsBar.style.display = 'none';

  try {
    const res = await fetch('/qr');
    const data = await res.json();
    if (data.qr) {
      const img = document.createElement('img');
      img.src = data.qr; img.alt = 'QR Code';
      qrWrap.innerHTML = ''; qrWrap.appendChild(img);
      statusText.textContent = i18n[lang].ready;
      stepsBar.style.display = '';
    } else {
      throw new Error('no_qr');
    }
  } catch {
    qrWrap.innerHTML = '<div style="color:rgba(255,255,255,.3);font-size:.8125rem;padding:1rem">—</div>';
    statusText.textContent = i18n[lang].error;
    reloadBtn.classList.add('visible');
  }
}

document.getElementById('reloadBtn').addEventListener('click', loadQR);

applyLang();
loadQR();
</script>
</body>
</html>
