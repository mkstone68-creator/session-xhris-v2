<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XHRIS SESSIONS — QR Code</title>
<link rel="icon" type="image/png" href="https://xhrishost.site/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  body {
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 2.5rem;
    max-width: 450px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: rgba(255, 255, 255, 0.7); margin-bottom: 1.5rem; line-height: 1.5; }
  #qr-container {
    background: #fff;
    padding: 1rem;
    border-radius: 16px;
    margin: 1.5rem auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 280px;
    min-height: 280px;
  }
  #qr-container img { display: block; max-width: 100%; }
  .spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(139, 92, 246, 0.3);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: #c4b5fd;
    text-decoration: none;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border: 1px solid rgba(196, 181, 253, 0.3);
    border-radius: 8px;
    transition: all 0.2s;
  }
  .footer-link:hover {
    background: rgba(196, 181, 253, 0.1);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 Connexion par QR Code</h1>
    <p>Scannez ce QR depuis WhatsApp → Paramètres → Appareils liés</p>

    <div id="qr-container">
      <div class="spinner"></div>
    </div>

    <p id="status">Génération du QR code en cours...</p>

    <a href="/" class="footer-link">← Retour à l'accueil</a>
  </div>

  <script>
    async function loadQR() {
      try {
        const res = await fetch('/qr');
        const data = await res.json();
        const container = document.getElementById('qr-container');
        const status = document.getElementById('status');

        if (data.qr) {
          container.innerHTML = `<img src="${data.qr}" alt="QR Code">`;
          status.textContent = 'Scannez le QR code ci-dessus. Votre session arrivera sur WhatsApp.';
        } else {
          status.textContent = '❌ Erreur : impossible de générer le QR';
        }
      } catch (e) {
        document.getElementById('status').textContent = '❌ ' + e.message;
      }
    }
    loadQR();
  </script>
</body>
</html>
